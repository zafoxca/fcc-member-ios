name: Build & Upload iOS App to App Store Connect

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Destination'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - app_store

jobs:
  build:
    name: Build & Deploy iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Run Fastlane (Build, Sign & Upload to Apple)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          if [ "${{ github.event.inputs.target }}" == "app_store" ]; then
            fastlane release
          else
            fastlane beta
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FCCMember-IPA
          path: build/*.ipa
